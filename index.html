<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>IIM Shillong — Umsawli Campus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #1d1f2b;
    --shell-a: #9a9ee0;
    --shell-b: #5c60a8;
    --bezel: #23253a;
    --ink: #e9ecff;
    --muted: #b4b8e4;
    --btn: #b43a5c;
    --pixel: 'Press Start 2P', ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
  body { display: flex; justify-content: center; padding: 16px; }
  #shell { width: 100%; max-width: 940px;
    background: linear-gradient(160deg, var(--shell-a), var(--shell-b));
    border-radius: 22px 22px 70px 22px; padding: 18px 18px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.35); }
  #title { text-align: center; font: 700 12px/1 var(--pixel); letter-spacing: .08em;
    color: #14152a; margin: 2px 0 12px; text-transform: uppercase; }
  #bezel { background: var(--bezel); border-radius: 12px 12px 36px 12px; padding: 16px; }
  #screen { position: relative; width: 100%; aspect-ratio: 20 / 14; background: #000;
    border: 3px solid #0c0d18; border-radius: 4px; overflow: hidden; }
  canvas#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; background: #5cc8a4; }
  #dialog { position: absolute; left: 2%; right: 2%; bottom: 3%; min-height: 27%;
    background: #fbfbfb; border: 4px solid #3c4a70; border-radius: 10px;
    box-shadow: inset 0 0 0 3px #aab4d8, 0 3px 0 rgba(0,0,0,.35);
    padding: 3.2% 3.5% 2.6%; display: none; color: #202030; }
  #dialog.open { display: block; }
  #dlg-who { position: absolute; top: -13px; left: 14px; background: #3c4a70; color: #fff;
    font: 700 clamp(7px, 1.35vw, 11px)/1 var(--pixel); padding: 6px 9px; border-radius: 5px; text-transform: uppercase; }
  #dlg-text { font: 700 clamp(9px, 1.6vw, 14px)/1.7 var(--pixel); }
  #dlg-more { position: absolute; right: 16px; bottom: 8px; font-size: 14px; color: #d03040;
    animation: bob .8s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  #hud { margin-top: 12px; display: flex; justify-content: space-between; gap: 10px;
    font: 700 10px/1.4 var(--pixel); color: var(--muted); }
  #hud b { color: #fff; }
  #controls { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-top: 16px; padding: 0 6px; user-select: none; -webkit-user-select: none; }
  #dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 2px; }
  #dpad button { background: #2a2c44; border: 0; border-radius: 6px; color: #cfd2ff; font-size: 18px;
    touch-action: none; cursor: pointer; box-shadow: 0 3px 0 #14152a; }
  #dpad button:active, #dpad button.on { background: #444868; transform: translateY(2px); box-shadow: 0 1px 0 #14152a; }
  #dpad .blank { background: transparent; box-shadow: none; pointer-events: none; }
  #mini { border: 3px solid #14152a; border-radius: 4px; image-rendering: pixelated; width: 168px; height: 120px;
    background: #5cc8a4; max-width: 36vw; height: auto; aspect-ratio: 56 / 40; }
  #abtn { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--btn); color: #fff;
    font: 700 22px var(--pixel); box-shadow: 0 5px 0 #6c1f36; touch-action: none; cursor: pointer; }
  #abtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #6c1f36; }
  #hint { text-align: center; font: 700 9px/1.6 var(--pixel); color: #14152a; margin-top: 14px; opacity: .85; }
  #legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin-top: 12px;
    font: 700 9px var(--pixel); color: #14152a; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 12px; height: 12px; border: 2px solid rgba(0,0,0,.55); display: inline-block; }
  #fatal { display: none; background: #5a1420; color: #fff; padding: 12px; margin-top: 12px; border-radius: 8px;
    font-size: 12px; white-space: pre-wrap; }
  #ascii { display: none; font-size: 9px; line-height: 9px; margin-top: 12px; color: #14152a; overflow: auto; }
</style>
</head>
<body>
<div id="shell">
  <p id="title">IIM Shillong · Umsawli Campus</p>
  <div id="bezel">
    <div id="screen">
      <canvas id="game" width="960" height="672"></canvas>
      <div id="dialog" role="dialog" aria-live="polite">
        <div id="dlg-who"></div>
        <div id="dlg-text"></div>
        <div id="dlg-more">▼</div>
      </div>
    </div>
  </div>
  <div id="hud"><div>📍 <b id="loc">On the road</b></div><div>X,Y <span id="pos">29,32</span></div></div>
  <div id="controls">
    <div id="dpad">
      <div class="blank"></div><button data-dir="up" aria-label="Up">▲</button><div class="blank"></div>
      <button data-dir="left" aria-label="Left">◀</button><div class="blank"></div><button data-dir="right" aria-label="Right">▶</button>
      <div class="blank"></div><button data-dir="down" aria-label="Down">▼</button><div class="blank"></div>
    </div>
    <canvas id="mini" width="112" height="80" title="Campus map"></canvas>
    <button id="abtn" aria-label="Interact">A</button>
  </div>
  <div id="hint">ARROWS / WASD = WALK · SPACE / ENTER / Z = TALK / INTERACT</div>
  <div id="legend"></div>
  <div id="fatal"></div>
  <pre id="ascii"></pre>
</div>

<script>
'use strict';

// ============================================================
// 1. Constants + tile enum
// ============================================================
const COLS = 56, ROWS = 40, TILE = 16;
const VIEW_W = 20, VIEW_H = 14;       // Pokémon-style close-up camera
const SCALE = 3;                       // low-res buffer -> display canvas
const SPEED = 3.4;                     // tiles / second

const T = {
  FOREST: 0, GRASS: 1, GRASS2: 2, PATH: 3, PATH_EDGE: 4, WATER: 5, WATER2: 6,
  LAWN: 7, FOUNTAIN: 8, COURT_A1: 9, COURT_A2: 10, COURT_B: 11,
  WALL: 12, ROOF: 13, DOOR: 14, SIGN: 15, TREE: 16, FENCE: 17, FLOWER: 18
};
const BLOCKING = new Set([T.FOREST, T.WATER, T.WATER2, T.WALL, T.ROOF, T.FOUNTAIN, T.TREE, T.FENCE]);

// ============================================================
// 2. Map data + generation (pure, no DOM / canvas)
// ============================================================
// ==== MAP:BEGIN
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// Town layout: a 4-tile pine border, 2-tile cobble roads in a grid, four lawn blocks, gate at the bottom.
const BUILDINGS = [
  { id: 'kalam',    label: 'Dr. Kalam Centre',                 short: 'Kalam Centre',   x: 20, y: 8,  w: 7,  h: 5, door: [3, 4],
    text: 'Dr. Kalam Centre, IIM Shillong — lecture halls just off the entrance road, named for the former President.' },
  { id: 'admin',    label: 'New Admin Block',                  short: 'Admin Block',    x: 32, y: 8,  w: 8,  h: 6, door: [3, 5],
    text: 'The new IIM Shillong Administration Block — the angular grey roof overlooking the campus pond.' },
  { id: 'nect',     label: 'North East Centre for Technology', short: 'NE Tech Centre', x: 41, y: 8,  w: 7,  h: 5, door: [0, 4],
    text: 'North East Centre for Technology — a research wing on the eastern hillside, still being built out.' },
  { id: 'pavilion', label: 'Open Pavilion',                    short: 'Pavilion',       x: 24, y: 21, w: 4,  h: 4, door: [1, 3],
    text: 'A small octagonal pavilion halfway down the hill — a quiet spot to sit between classes.' },
  { id: 'academic', label: 'Main Academic Block',              short: 'Academic Block', x: 31, y: 20, w: 11, h: 7, door: [5, 6],
    text: 'The Main Academic Block — the largest roof on campus, fronted by a circular garden and fountain.' }
];
const COURTS = [
  { id: 'courts', label: 'Basketball Courts',    short: 'Basketball',    x: 10, y: 9,  w: 7, h: 4, kind: 'basketball',
    text: 'The basketball courts — a blue-and-green checkerboard where every evening game gets loud.' },
  { id: 'tennis', label: 'Tennis & Pool Courts', short: 'Tennis & Pool', x: 41, y: 28, w: 7, h: 5, kind: 'clay',
    text: 'Tennis & pool courts on the lower terrace — clay red, with a view down the valley.' }
];
const GARDENS = [
  { cx: 36, cy: 29, r: 3 },  // fronts the Main Academic Block
  { cx: 45, cy: 23, r: 2 }
];
const POND = { cx: 16, cy: 27, rx: 7.5, ry: 4.5, irx: 5.5, iry: 3.2 };
const GATE = { x: 28, y: 36, label: 'Main Gate', short: 'Main Gate',
  text: 'Indian Institute of Management Shillong — Umsawli Campus. Welcome!' };
const SPAWN = { x: 29, y: 32 };

const ROADS = [                       // [x0, y0, x1, y1] inclusive, all 2 tiles wide
  [6, 5, 49, 6],    // north road
  [6, 18, 49, 19],  // middle road
  [6, 5, 7, 35],    // west road
  [48, 5, 49, 35],  // east road
  [28, 5, 29, 39]   // main road, runs out through the gate
];
const FLOWER_BEDS = [[8, 14, 11, 15], [30, 14, 32, 16], [8, 20, 12, 21], [43, 33, 47, 35], [18, 14, 20, 15]];
const FENCES = [                      // [x0, x1, y, gaps...]  gaps are inclusive x ranges left open
  [8, 27, 17, [11, 13], [22, 24]],
  [30, 47, 17, [34, 36], [40, 42]]
];
const SCENERY_TREES = [               // 2x2 pines, top-left tile
  [18, 8], [18, 10], [30, 9], [30, 11], [44, 14], [46, 14], [24, 28], [24, 30], [43, 26],
  [31, 34], [33, 34], [35, 34], [37, 34], [39, 34],
  [9, 34], [11, 34], [13, 34], [15, 34], [17, 34]
];
const NPCS = [
  { id: 'guard', name: 'Gate Guard', x: 30, y: 34, dir: 'left', style: 'guard',
    text: 'Welcome to IIM Shillong! Follow the main road north — the Academic Block is straight ahead.' },
  { id: 'student1', name: 'Student', x: 28, y: 26, dir: 'right', style: 'student',
    text: 'The garden fountain is the best place to cram before a quiz. Do not tell the professors!' },
  { id: 'hooper', name: 'Basketball Fan', x: 13, y: 15, dir: 'up', style: 'girl',
    text: 'Pick-up games start at six every evening. Bring a friend, we are always one short!' },
  { id: 'prof', name: 'Professor', x: 33, y: 16, dir: 'right', style: 'prof',
    text: 'The Admin Block is right here. Placement season is coming... are you ready?' },
  { id: 'pond', name: 'Walker', x: 25, y: 26, dir: 'left', style: 'girl',
    text: 'Misty mornings at the pond are the best part of campus. Mind the edge though!' },
  { id: 'worker', name: 'Site Engineer', x: 42, y: 15, dir: 'up', style: 'guard',
    text: 'This research wing is still being built out. Hard hats required past this point!' }
];

function floodReach(grid, sx, sy, blockedCells) {
  const seen = new Set([sx + ',' + sy]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      if (BLOCKING.has(grid[ny][nx])) continue;
      const k = nx + ',' + ny;
      if (blockedCells && blockedCells.has(k)) continue;
      if (!seen.has(k)) { seen.add(k); q.push([nx, ny]); }
    }
  }
  return seen;
}

function generateMap() {
  const g = Array.from({ length: ROWS }, () => new Array(COLS).fill(T.GRASS));
  const inb = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
  const set = (x, y, t) => { if (inb(x, y)) g[y][x] = t; };
  const get = (x, y) => (inb(x, y) ? g[y][x] : T.FOREST);
  const fill = (x0, y0, x1, y1, t) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, t); };
  const interactables = {};

  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (hash2(x * 7.3, y * 3.1) < 0.12) g[y][x] = T.GRASS2;

  // cobble roads
  for (const [x0, y0, x1, y1] of ROADS) fill(x0, y0, x1, y1, T.PATH);

  // pond
  const P = POND;
  for (let y = Math.floor(P.cy - P.ry); y <= Math.ceil(P.cy + P.ry); y++)
    for (let x = Math.floor(P.cx - P.rx); x <= Math.ceil(P.cx + P.rx); x++) {
      const outer = ((x - P.cx) / P.rx) ** 2 + ((y - P.cy) / P.ry) ** 2;
      if (outer <= 1) {
        const inner = ((x - P.cx) / P.irx) ** 2 + ((y - P.cy) / P.iry) ** 2;
        set(x, y, inner <= 1 ? T.WATER2 : T.WATER);
      }
    }

  // buildings
  for (const b of BUILDINGS) {
    for (let y = b.y; y < b.y + b.h; y++)
      for (let x = b.x; x < b.x + b.w; x++) {
        const edge = x === b.x || y === b.y || x === b.x + b.w - 1 || y === b.y + b.h - 1;
        set(x, y, edge ? T.WALL : T.ROOF);
      }
    const dx = b.x + b.door[0], dy = b.y + b.door[1];
    set(dx, dy, T.DOOR);
    interactables[dx + ',' + dy] = { who: b.label, text: b.text };
  }

  // courts
  for (const c of COURTS) {
    for (let y = c.y; y < c.y + c.h; y++)
      for (let x = c.x; x < c.x + c.w; x++) {
        if (c.kind === 'basketball')
          set(x, y, (((x - c.x) >> 1) + ((y - c.y) >> 1)) % 2 === 0 ? T.COURT_A1 : T.COURT_A2);
        else set(x, y, T.COURT_B);
        interactables[x + ',' + y] = { who: c.label, text: c.text };
      }
  }

  // circular gardens with fountains (only reclaim plain grass)
  for (const gd of GARDENS) {
    for (let y = gd.cy - gd.r; y <= gd.cy + gd.r; y++)
      for (let x = gd.cx - gd.r; x <= gd.cx + gd.r; x++) {
        const t = get(x, y);
        if (Math.hypot(x - gd.cx, y - gd.cy) <= gd.r + 0.01 && (t === T.GRASS || t === T.GRASS2)) set(x, y, T.LAWN);
      }
    set(gd.cx, gd.cy, T.FOUNTAIN);
  }

  // gate sign
  set(GATE.x, GATE.y, T.SIGN);
  interactables[GATE.x + ',' + GATE.y] = { who: GATE.label, text: GATE.text };

  // flower beds
  for (const [x0, y0, x1, y1] of FLOWER_BEDS)
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
      if (get(x, y) === T.GRASS || get(x, y) === T.GRASS2) set(x, y, T.FLOWER);

  // red post fences along the south edge of the north blocks (with gaps in front of doors)
  const fenceCells = [];
  for (const [x0, x1, y, ...gaps] of FENCES)
    for (let x = x0; x <= x1; x++) {
      if (gaps.some(([a, b]) => x >= a && x <= b)) continue;
      if (get(x, y) === T.GRASS || get(x, y) === T.GRASS2 || get(x, y) === T.FLOWER) { set(x, y, T.FENCE); fenceCells.push([x, y]); }
    }

  // 2x2 pine trees: forest border (with the gate gap) + scenery
  const trees = [];
  const plant = (tx, ty) => { trees.push([tx, ty]); fill(tx, ty, tx + 1, ty + 1, T.TREE); };
  for (let ty = 0; ty < ROWS; ty += 2)
    for (let tx = 0; tx < COLS; tx += 2) {
      if (!(tx < 4 || tx >= 52 || ty < 4 || ty >= 36)) continue;
      if (ty >= 36 && tx === 28) continue;
      plant(tx, ty);
    }
  const scenery = [];
  for (const [tx, ty] of SCENERY_TREES) {
    const free = [[0,0],[1,0],[0,1],[1,1]].every(([dx, dy]) => { const t = get(tx + dx, ty + dy); return t === T.GRASS || t === T.GRASS2; });
    if (free) { plant(tx, ty); scenery.push([tx, ty]); }
  }

  // safety net: if the decorations ever wall anything off, drop them
  const npcCells = new Set(NPCS.map((n) => n.x + ',' + n.y));
  const reach = floodReach(g, SPAWN.x, SPAWN.y, npcCells);
  if (Object.keys(interactables).some((k) => !reach.has(k))) {
    for (const [tx, ty] of scenery) { fill(tx, ty, tx + 1, ty + 1, T.GRASS); trees.splice(trees.findIndex((t) => t[0] === tx && t[1] === ty), 1); }
    for (const [x, y] of fenceCells) set(x, y, T.GRASS);
  }

  return { grid: g, interactables, trees };
}
// ==== MAP:END

// ============================================================
// 3. Pixel-art sprite factory (all art is drawn in code)
// ============================================================
function mk(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  return [c, g];
}
const R = (g, c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
function disc(g, c, cx, cy, r) {
  g.fillStyle = c;
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r * r) g.fillRect(x, y, 1, 1);
    }
}
function ring(g, c, cx, cy, r0, r1) {
  g.fillStyle = c;
  for (let y = Math.floor(cy - r1); y <= Math.ceil(cy + r1); y++)
    for (let x = Math.floor(cx - r1); x <= Math.ceil(cx + r1); x++) {
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
      if (d >= r0 && d <= r1) g.fillRect(x, y, 1, 1);
    }
}
function ellipse(g, c, cx, cy, rx, ry) {
  g.fillStyle = c;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) g.fillRect(x, y, 1, 1);
    }
}
// paint a 1px dark outline just outside every opaque pixel
function outlineOut(c, rgb) {
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const d = g.getImageData(0, 0, w, h), src = d.data, out = new Uint8ClampedArray(src);
  const A = (x, y) => x >= 0 && y >= 0 && x < w && y < h && src[(y * w + x) * 4 + 3] > 0;
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      if (A(x, y)) continue;
      if (A(x - 1, y) || A(x + 1, y) || A(x, y - 1) || A(x, y + 1)) {
        const i = (y * w + x) * 4; out[i] = rgb[0]; out[i + 1] = rgb[1]; out[i + 2] = rgb[2]; out[i + 3] = 255;
      }
    }
  g.putImageData(new ImageData(out, w, h), 0, 0);
}

const isWater = (t) => t === T.WATER || t === T.WATER2;
const isLawnish = (t) => t === T.LAWN || t === T.FOUNTAIN;
// anything a cobble road gets a scalloped edge against
const isSoft = (t) => t === T.GRASS || t === T.GRASS2 || t === T.LAWN || t === T.FLOWER || t === T.FENCE ||
  t === T.TREE || t === T.FOREST || t === T.FOUNTAIN || isWater(t);

let world = null;
function tileAt(x, y) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return T.TREE;
  return world.grid[y][x];
}

// ---------- tile painters (each paints one 16x16 tile at pixel X,Y) ----------
function paintGrass(g, X, Y, x, y) {
  const h1 = hash2(x, y), h2 = hash2(y + 17, x + 31);
  R(g, h1 < 0.5 ? '#5cc8a4' : '#56c19d', X, Y, 16, 16);
  const tuft = (tx, ty) => {
    R(g, '#3c9c7c', X + tx, Y + ty, 1, 1); R(g, '#3c9c7c', X + tx + 2, Y + ty, 1, 1);
    R(g, '#3c9c7c', X + tx + 1, Y + ty + 1, 1, 1); R(g, '#88e8c4', X + tx + 1, Y + ty - 1, 1, 1);
  };
  if (h1 > 0.45) tuft(1 + ((h1 * 97) | 0) % 10, 2 + ((h2 * 53) | 0) % 10);
  if (h2 > 0.7) tuft(2 + ((h2 * 71) | 0) % 10, 3 + ((h1 * 41) | 0) % 10);
}
function paintFlowers(g, X, Y, x, y) {
  paintGrass(g, X, Y, x, y);
  const fl = (ox, oy) => {
    const fx = X + ox, fy = Y + oy;
    R(g, '#2c8a58', fx + 1, fy + 4, 1, 2); R(g, '#2c8a58', fx - 1, fy + 5, 2, 1); R(g, '#2c8a58', fx + 2, fy + 5, 2, 1);
    R(g, '#d83838', fx, fy, 3, 3); R(g, '#f06868', fx, fy, 1, 1);
    R(g, '#f8d040', fx + 1, fy + 1, 1, 1);
    R(g, '#8a1c1c', fx, fy + 3, 3, 1);
  };
  fl(2, 2); fl(9, 8);
}
function paintLawn(g, X, Y, x, y) {
  R(g, ((x + y) & 1) ? '#80dcb4' : '#76d4ac', X, Y, 16, 16);
  R(g, '#9ceac8', X + 2, Y + 3, 2, 1); R(g, '#9ceac8', X + 10, Y + 10, 2, 1);
  const edge = '#3c9c7c';
  if (!isLawnish(tileAt(x, y - 1))) R(g, edge, X, Y, 16, 1);

let dlgOpen = false, typeTimer = null, fullText = '';

function showDialog(who, text) {
  dlgOpen = true; dlg.classList.add('open');
  dlgWho.textContent = who; fullText = text; dlgText.textContent = '';
  clearInterval(typeTimer);
  let i = 0;
  typeTimer = setInterval(() => {
    i += 1; dlgText.textContent = fullText.slice(0, i);
    if (i >= fullText.length) clearInterval(typeTimer);
  }, 18);
}
function closeDialog() { dlgOpen = false; dlg.classList.remove('open'); clearInterval(typeTimer); }

function targetHit() {
  const [dx, dy] = DIRS[player.dir];
  const tx = player.x + dx, ty = player.y + dy;
  const n = npcAt(tx, ty);
  if (n) return { who: n.name, text: n.text, npc: n };
  return world.interactables[tx + ',' + ty] || world.interactables[player.x + ',' + player.y] || null;
}
function interact() {
  if (!world) return;
  if (dlgOpen) {
    if (dlgText.textContent.length < fullText.length) { clearInterval(typeTimer); dlgText.textContent = fullText; }
    else closeDialog();
    return;
  }
  if (player.moving) return;
  const hit = targetHit();
  if (hit && hit.npc) hit.npc.dir = OPP[player.dir];      // they turn to face you
  showDialog(hit ? hit.who : 'Guide', hit ? hit.text : 'Nothing to see here. Try walking up to a door, a court, the gate sign or someone to talk to.');
}

// ============================================================
// 5. update(dt)
// ============================================================
function walkable(x, y) {
  return x >= 0 && y >= 0 && x < COLS && y < ROWS && !BLOCKING.has(world.grid[y][x]) && !npcAt(x, y);
}
function update(dt) {
  if (player.moving) {
    player.prog += SPEED * dt;
    if (player.prog >= 1) {
      player.x = player.toX; player.y = player.toY; player.fx = player.x; player.fy = player.y;
      player.moving = false; player.prog = 0; player.foot = player.foot === 1 ? 2 : 1;
    } else {
      player.fx = player.fromX + (player.toX - player.fromX) * player.prog;
      player.fy = player.fromY + (player.toY - player.fromY) * player.prog;
    }
  }
  if (!player.moving && !dlgOpen && held.length) {
    const d = held[held.length - 1], [dx, dy] = DIRS[d];
    player.dir = d;
    if (walkable(player.x + dx, player.y + dy)) {
      player.moving = true; player.prog = 0;
      player.fromX = player.x; player.fromY = player.y;
      player.toX = player.x + dx; player.toY = player.y + dy;
    }
  }
}

// ============================================================
// 6. render()
// ============================================================
const FONT = "'Press Start 2P', ui-monospace, Menlo, Consolas, monospace";
function plaque(text, cx, cy) {            // crisp hi-res label above a landmark
  ctx.font = `bold 11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = Math.ceil(ctx.measureText(text).width) + 16, h = 22;
  const x = Math.round(cx - w / 2), y = Math.round(cy - h / 2);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(x + 2, y + 3, w, h);
  ctx.fillStyle = '#fffbe8'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#303050'; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  ctx.fillStyle = '#202030'; ctx.fillText(text, Math.round(cx), Math.round(cy) + 1);
}

function render() {
  const camX = Math.min(Math.max(player.fx + 0.5 - VIEW_W / 2, 0), COLS - VIEW_W);
  const camY = Math.min(Math.max(player.fy + 0.5 - VIEW_H / 2, 0), ROWS - VIEW_H);
  const cpx = Math.round(camX * TILE), cpy = Math.round(camY * TILE);
  const wave = Math.floor(now * 2.5) % 4;

  bctx.drawImage(staticMap, cpx, cpy, BW, BH, 0, 0, BW, BH);

  const vx0 = Math.floor(camX) - 1, vx1 = Math.ceil(camX) + VIEW_W, vy0 = Math.floor(camY) - 1, vy1 = Math.ceil(camY) + VIEW_H;
  for (const [x, y] of waterTiles) {
    if (x < vx0 || x > vx1 || y < vy0 || y > vy1) continue;
    const h = hash2(x, y), px = x * TILE - cpx, py = y * TILE - cpy;
    const wx = 3 + (((h * 16) | 0) + wave * 3) % 8;
    R(bctx, '#9fd4ff', px + wx, py + 5 + ((h * 4) | 0), 3, 1);
    R(bctx, '#7cbcf4', px + 14 - wx, py + 11, 2, 1);
  }
  for (const [x, y] of fountainTiles) {
    if (x < vx0 || x > vx1 || y < vy0 || y > vy1) continue;
    const px = x * TILE - cpx, py = y * TILE - cpy, f = wave;
    R(bctx, '#ffffff', px + 8 + [0, 2, 0, -2][f], py + 4 + (f & 1), 1, 1);
    R(bctx, '#d8f2ff', px + 8 - [0, 2, 0, -2][f], py + 11 - (f & 1), 1, 1);
    R(bctx, '#ffffff', px + 8, py + 3, 1, 2);
  }

  // characters, drawn back-to-front
  const actors = NPCS.filter((n) => n.x >= vx0 && n.x <= vx1 && n.y >= vy0 && n.y <= vy1)
    .map((n) => ({ y: n.y, draw: () => {
      const px = n.x * TILE - cpx, py = n.y * TILE - cpy;
      R(bctx, 'rgba(10,70,60,.3)', px + 4, py + 13, 8, 2);
      bctx.drawImage(NSPR[n.style][n.dir][0], px - 1, py - 6);
    } }));
  actors.push({ y: player.fy, draw: () => {
    const px = Math.round(player.fx * TILE - cpx), py = Math.round(player.fy * TILE - cpy);
    R(bctx, 'rgba(10,70,60,.3)', px + 4, py + 13, 8, 2); R(bctx, 'rgba(10,70,60,.2)', px + 3, py + 14, 10, 1);
    const frame = player.moving && player.prog < 0.55 ? player.foot : 0;
    bctx.drawImage(PSPR[player.dir][frame], px - 1, py - 6);
  } });
  actors.sort((a, b) => a.y - b.y).forEach((a) => a.draw());

  // upscale to the display canvas (nearest neighbour = crisp pixels)
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(buf, 0, 0, BW, BH, 0, 0, cv.width, cv.height);

  // labels
  const S = SCALE * TILE;
  const toScr = (tx, ty) => [(tx - camX) * S, (ty - camY) * S];
  const labelAt = (txt, tx, ty) => {
    const [sx, sy] = toScr(tx, ty);
    if (sx > -120 && sx < cv.width + 120 && sy > -20 && sy < cv.height + 20) plaque(txt, sx, sy);
  };
  for (const b of BUILDINGS) labelAt(b.short, b.x + b.w / 2, b.y - 0.55);
  for (const c of COURTS) labelAt(c.short, c.x + c.w / 2, c.y - 0.55);
  labelAt(GATE.short, GATE.x + 0.5, GATE.y - 0.7);

  // "A" prompt bubble when something can be interacted with
  if (!dlgOpen && !player.moving && targetHit()) {
    const [sx, sy] = toScr(player.x + 0.5, player.y - 0.7);
    const bob = Math.round(Math.sin(now * 6) * 2);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#303050'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx, sy + bob, 15, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d03040'; ctx.font = `bold 16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('A', sx, sy + bob + 1);
  }
}

// ---- minimap + HUD
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
const MINI_COL = {};
MINI_COL[T.FOREST] = '#2a7a40'; MINI_COL[T.GRASS] = '#5cc8a4'; MINI_COL[T.GRASS2] = '#5cc8a4';
MINI_COL[T.PATH] = '#c8d6f2'; MINI_COL[T.PATH_EDGE] = '#c8d6f2'; MINI_COL[T.WATER] = '#3c9ee8';
MINI_COL[T.WATER2] = '#2f86d6'; MINI_COL[T.LAWN] = '#80dcb4'; MINI_COL[T.FOUNTAIN] = '#80dcb4';
MINI_COL[T.COURT_A1] = '#3a74b0'; MINI_COL[T.COURT_A2] = '#4f9d5c'; MINI_COL[T.COURT_B] = '#c8704a';
MINI_COL[T.WALL] = '#8a4a6a'; MINI_COL[T.ROOF] = '#d05848'; MINI_COL[T.DOOR] = '#2c64c8';
MINI_COL[T.SIGN] = '#e0b878'; MINI_COL[T.TREE] = '#3a9c40'; MINI_COL[T.FENCE] = '#d8505c'; MINI_COL[T.FLOWER] = '#e86868';
let miniBase = null;
function buildMini() {
  const [c, g] = mk(COLS * 2, ROWS * 2);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) R(g, MINI_COL[world.grid[y][x]], x * 2, y * 2, 2, 2);
  miniBase = c;
}
function drawMini() {
  mctx.imageSmoothingEnabled = false; mctx.drawImage(miniBase, 0, 0);
  if (Math.floor(now * 3) % 2 === 0) R(mctx, '#fff', player.x * 2 - 1, player.y * 2 - 1, 4, 4);
  R(mctx, '#e03838', player.x * 2, player.y * 2, 2, 2);
}

const locEl = document.getElementById('loc'), posEl = document.getElementById('pos');
function locationName() {
  const t = tileAt(player.x, player.y), hit = world.interactables[player.x + ',' + player.y];
  if (t === T.DOOR || t === T.SIGN || t === T.COURT_A1 || t === T.COURT_A2 || t === T.COURT_B) return hit ? hit.who : 'Campus';
  if (t === T.PATH || t === T.PATH_EDGE) return 'On the road';
  if (t === T.LAWN) return 'Garden lawn';
  return 'Campus grounds';
}

// ============================================================
// 7. Loop (started unconditionally)
// ============================================================
let now = 0;
function showFatal(err) {
  console.error(err);
  const f = document.getElementById('fatal');
  f.style.display = 'block'; f.textContent = 'Map failed to build:\n' + (err && err.stack || err);
}
function buildLegend() {
  const items = [['Cobble road', '#c8d6f2'], ['Lawn', '#5cc8a4'], ['Pine trees', '#4eaa3a'], ['Pond', '#3c9ee8'],
    ['Garden', '#80dcb4'], ['Buildings', '#e45a4c'], ['Courts', '#3a74b0'], ['Fence', '#d8505c']];
  document.getElementById('legend').innerHTML = items.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');
}

let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts; now = ts / 1000;
  try {
    update(dt); render(); drawMini();
    locEl.textContent = locationName(); posEl.textContent = player.x + ',' + player.y;
  } catch (err) { showFatal(err); return; }
  requestAnimationFrame(frame);
}

try {
  buildLegend();
  world = generateMap();
  if (!walkable(SPAWN.x, SPAWN.y)) throw new Error('Spawn tile is blocking');
  staticMap = buildStatic();
  buildSprites();
  buildMini();
  if (location.search.includes('ascii')) {
    const ch = '#.,=~oO*@ab_WRDSTFf';
    const pre = document.getElementById('ascii'); pre.style.display = 'block';
    pre.textContent = world.grid.map((r) => r.map((t) => ch[t]).join('')).join('\n');
  }
  window.__game = { world, player, T, BLOCKING, press, release, interact, COLS, ROWS, NPCS };
} catch (err) { showFatal(err); }
requestAnimationFrame(frame);
</script>
