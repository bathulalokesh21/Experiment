<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS X · phone</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico">
<style>
:root { --c: #ffc24a; --bg: #04060c; --line: rgba(255,255,255,.12); --dim: #8d99ad; }
* { box-sizing: border-box; } html, body { height: 100%; margin: 0; }
body { background: radial-gradient(600px 500px at 50% 30%, #0b1222, var(--bg) 70%); color: #e9eef7; font: 15px/1.45 system-ui, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr auto auto auto; gap: 10px; padding: 14px; }
button, input { font: inherit; color: inherit; } button { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
header { display: flex; gap: 8px; } header button { flex: 1; } header button.on { border-color: var(--c); color: var(--c); }
#orb { display: grid; place-items: center; min-height: 0; }
#orb canvas { width: min(70vw, 46vh); height: min(70vw, 46vh); }
#caption { text-align: center; min-height: 66px; font-size: 18px; font-weight: 300; }
#speaker { font: 600 11px ui-monospace, monospace; letter-spacing: .3em; color: var(--c); text-align: center; }
#cards:empty { display: none; } .card { border: 1px solid var(--c); border-radius: 14px; padding: 12px; margin-bottom: 8px; background: rgba(8,12,22,.9); }
.card h4 { margin: 0 0 6px; color: var(--c); font-size: 13px; } .card p { margin: 2px 0; white-space: pre-wrap; overflow-wrap: anywhere; } .card div { display: flex; gap: 8px; margin-top: 8px; } .card button { flex: 1; }
form { display: flex; gap: 8px; } form input { flex: 1; min-width: 0; background: rgba(0,0,0,.4); border: 1px solid var(--line); border-radius: 99px; padding: 14px 18px; }
#talk { width: 100%; padding: 18px; font-size: 18px; border-radius: 99px; border-color: var(--c); color: var(--c); }
#pair { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center; z-index: 5; }
#pair input { font-size: 28px; letter-spacing: .3em; text-align: center; width: 220px; padding: 12px; border-radius: 14px; background: #000; border: 1px solid var(--c); }
.sub { color: var(--dim); font-size: 13px; } [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="pair" hidden><div><h2>Pair with JARVIS</h2><p class="sub">Enter the 6-digit PIN shown in the “Phone companion” panel on the laptop.</p>
  <form id="pair-form"><input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="PIN"><button>Pair</button></form><p id="pair-msg" class="sub"></p></div></div>
<header id="crew"></header>
<div id="orb"><canvas id="c" width="600" height="600"></canvas></div>
<div><div id="speaker"></div><div id="caption">Tap the button, or type.</div></div>
<div id="cards"></div>
<div>
  <form id="f"><input id="t" placeholder="Type, or use your keyboard's mic" aria-label="Message" enterkeyhint="send"><button>Send</button></form>
  <button id="talk" style="margin-top:10px">Hold to talk</button>
  <p class="sub" id="note" style="text-align:center"></p>
</div>
<script>
const $ = (s) => document.querySelector(s);
const api = async (method, url, body) => { try { const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined }); return { status: r.status, ...(await r.json().catch(() => ({}))) }; } catch { return { ok: false, status: 0, message: 'The laptop is not reachable.' }; } };
let personas = [], persona = 'jarvis', level = 0, speaking = false, busy = false, audio = null;

async function init() {
  const s = await api('GET', '/api/state');
  if (s.status === 401 || s.status === 403) { $('#pair').hidden = false; $('#pair-msg').textContent = s.status === 403 ? s.message : ''; return; }
  if (!s.ok) { $('#caption').textContent = s.message || 'The laptop is not reachable.'; return; }
  $('#pair').hidden = true;
  personas = s.personas; persona = s.settings.active || 'jarvis';
  renderCrew(); cards();
  setInterval(cards, 4000);
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec || !window.isSecureContext) { $('#talk').hidden = true; $('#note').textContent = 'Phone browsers only allow the mic on https pages, so use the mic key on your keyboard to dictate.'; }
  else setupTalk(Rec);
}
function renderCrew() {
  $('#crew').innerHTML = '';
  for (const p of personas) { const b = document.createElement('button'); b.textContent = p.name; b.className = p.id === persona ? 'on' : ''; b.onclick = () => { persona = p.id; renderCrew(); }; $('#crew').append(b); }
  const p = personas.find((x) => x.id === persona); if (p) document.documentElement.style.setProperty('--c', p.colour);
}
$('#pair-form').onsubmit = async (e) => { e.preventDefault(); const r = await api('POST', '/api/pair', { pin: $('#pin').value.trim() }); if (r.ok) init(); else $('#pair-msg').textContent = r.message || 'Wrong PIN.'; };
$('#f').onsubmit = (e) => { e.preventDefault(); const v = $('#t').value.trim(); if (v) { $('#t').value = ''; ask(v); } };

async function ask(text) {
  if (busy) return; busy = true;
  $('#speaker').textContent = 'YOU'; $('#caption').textContent = text;
  let full = '';
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ persona, text }) });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) { const { value, done } = await reader.read(); if (done) break; buf += dec.decode(value, { stream: true }); let i;
      while ((i = buf.indexOf('\n\n')) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 2); if (!line.startsWith('data: ')) continue; const ev = JSON.parse(line.slice(6));
        if (ev.type === 'delta') { full += ev.text; $('#speaker').textContent = persona.toUpperCase(); $('#caption').textContent = full; } if (ev.type === 'error') full = full || ev.message; } }
  } catch { full = 'The laptop is not reachable.'; }
  $('#speaker').textContent = persona.toUpperCase(); $('#caption').textContent = full;
  busy = false; cards();
  if (full) { audio = new Audio(`/api/tts?persona=${persona}&text=${encodeURIComponent(full.slice(0, 900))}`); speaking = true; audio.onended = audio.onerror = () => { speaking = false; }; audio.play().catch(() => { speaking = false; }); }
}
async function cards() {
  const r = await api('GET', '/api/approvals'); if (!r.ok) return;
  $('#cards').innerHTML = '';
  for (const c of r.cards) { const d = document.createElement('div'); d.className = 'card'; const h = document.createElement('h4'); h.textContent = c.title; d.append(h);
    for (const f of c.fields) { if (f.code) continue; const p = document.createElement('p'); p.textContent = `${f.label}: ${f.value}`; d.append(p); }
    const row = document.createElement('div');
    for (const [label, action] of [['Approve', 'approve'], ['Cancel', 'cancel']]) { const b = document.createElement('button'); b.textContent = label; b.onclick = async () => { const out = await api('POST', `/api/approvals/${c.id}/${action}`, { via: 'phone' }); $('#caption').textContent = out.message || ''; cards(); }; row.append(b); }
    d.append(row); $('#cards').append(d); }
}
function setupTalk(Rec) {
  const btn = $('#talk'); let rec = null;
  const begin = (e) => { e.preventDefault(); if (audio) audio.pause(); rec = new Rec(); rec.lang = 'en-IN'; rec.onresult = (ev) => { const t = ev.results[0][0].transcript; if (ev.results[0].isFinal) ask(t); }; rec.start(); btn.textContent = 'Listening…'; };
  const end = () => { try { rec && rec.stop(); } catch {} btn.textContent = 'Hold to talk'; };
  btn.addEventListener('pointerdown', begin); btn.addEventListener('pointerup', end); btn.addEventListener('pointerleave', end);
}
// a light orb: the phone doesn't need the full WebGL engine
const g = $('#c').getContext('2d'); const dots = Array.from({ length: 420 }, () => ({ a: Math.random() * 6.28, b: Math.acos(Math.random() * 2 - 1), r: 0.55 + Math.random() * 0.45, s: Math.random() }));
function frame(t) {
  requestAnimationFrame(frame);
  level += ((speaking ? 0.55 + 0.45 * Math.sin(t / 90) : busy ? 0.3 : 0.05) - level) * 0.1;
  g.clearRect(0, 0, 600, 600); g.globalCompositeOperation = 'lighter';
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--c');
  const breath = 1 + Math.sin(t / 900) * 0.04 + level * 0.25;
  for (const d of dots) { const a = d.a + t / 4000, R = 200 * d.r * breath; const x = Math.sin(d.b) * Math.cos(a) * R, y = Math.cos(d.b) * R, z = Math.sin(d.b) * Math.sin(a);
    g.globalAlpha = 0.25 + 0.5 * (z + 1) / 2 + level * 0.2; const s = 1.5 + (z + 1) * 1.6 + level * 3 * d.s; g.fillRect(300 + x - s / 2, 300 - y - s / 2, s, s); }
  g.globalAlpha = 1;
}
requestAnimationFrame(frame);
init();
</script>
</body>
</html>
